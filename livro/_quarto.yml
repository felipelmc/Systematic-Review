project:
  type: book
  output-dir: docs

book:
  title: "Revisão sistemática de ponta a ponta"
  subtitle: "Protocolos metodológicos para revisões sistemáticas e avaliação de políticas públicas"
  author: "Felipe Lamarca"
  date: today
  date-format: "DD/MM/YYYY"
  search: true
  sharing: [twitter, linkedin]
  sidebar:
    style: docked
    background: light

  chapters:
    - index.qmd
    - metodo/01-fundamentos-tipos.qmd
    - metodo/02-pergunta-teoria.qmd
    - metodo/03-protocolo.qmd
    - metodo/04-busca.qmd
    - metodo/05-organizacao-triagem.qmd
    - metodo/06-qualidade-risco-vies.qmd
    - metodo/07-decomposicao.qmd
    - metodo/08a-sintese-quantitativa.qmd
    - metodo/08b-sintese-qualitativa-integracao.qmd
    - metodo/09-certeza-evidencia-pratica.qmd
    - metodo/10-relato-divulgacao.qmd
    - metodo/11-ia-na-revisao.qmd

  appendices:
    - metodo/apendice-a-leituras.qmd
    - metodo/apendice-b-reprodutibilidade.qmd
    - metodo/apendice-c-glossario.qmd
    - metodo/apendice-d-especificacao.qmd

bibliography: references.bib
lang: pt-BR

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-fold: true
    code-tools: true
    code-overflow: wrap
    highlight-style: github
    mainfont: "EB Garamond"
    monofont: "JetBrains Mono"
    fontsize: 1.15em
    linestretch: 1.7
    link-external-newwindow: true
    html-math-method: mathjax
    fig-align: center
    fig-responsive: true
    smooth-scroll: true
    anchor-sections: true
